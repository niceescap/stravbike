<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Créer un compte — Coach</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="login-page"><main class="login-card"><h1>🚴 Créer un compte Coach</h1><p>Ce compte Coach est distinct de votre compte Strava.</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form action="/signup" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="name">Nom affiché</label><input id="name" name="name" type="text" maxlength="120" autocomplete="name" required><label for="email">Email</label><input id="email" name="email" type="email" maxlength="254" autocomplete="email" required><label for="password">Mot de passe (12 caractères minimum)</label><input id="password" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><label for="password-confirm">Confirmer le mot de passe</label><input id="password-confirm" name="password_confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><button type="submit">Créer mon compte</button></form>
<p class="account-link"><a href="/login">Retour à la connexion</a></p><small>Prototype : email non vérifié. Utilisez une adresse que vous contrôlez. L'inscription peut être refermée après le premier compte.</small></main></body></html>
