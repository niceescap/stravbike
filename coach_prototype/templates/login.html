<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion — Coach</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="login-page"><main class="login-card"><h1>🚴 Coach</h1><p>Connectez-vous à votre compte Coach.</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form action="/login" method="post"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required><label for="password">Mot de passe</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Se connecter</button></form>
<p class="account-link"><a href="/signup">Créer un compte Coach</a></p><small>Les identifiants Coach sont distincts de ceux de Strava.</small></main></body></html>
