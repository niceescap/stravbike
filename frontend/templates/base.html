<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Coach Strava{% endblock %}</title>
    <meta name="api-key" content="{{ service_key }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body data-page="{{ page }}">

<header id="header">
    <div id="header-left">
        <a href="/calendar" id="logo">COACH <span>STRAVA</span></a>
        <div id="athlete-badge" style="display:none">
            <div class="avatar" id="athlete-initials">NS</div>
            <span id="athlete-name-text">—</span>
        </div>
    </div>
    <nav id="nav">
        <a href="/calendar"   class="nav-link" data-page="calendar">📅 Calendrier</a>
        <a href="/activities" class="nav-link" data-page="activities">🚴 Activités</a>
        <a href="/chat"       class="nav-link" data-page="chat">💬 Chat</a>
        <a href="/profile"    class="nav-link" data-page="profile">⚙️ Profil</a>
    </nav>
    <div id="header-right">
        <button class="btn-icon" onclick="App.refreshActivities()" title="Synchroniser Strava">
            <span id="sync-icon">↻</span> <span id="sync-label">Sync</span>
        </button>
    </div>
</header>

<main id="content">
    {% block content %}{% endblock %}
</main>

<div id="toast"></div>

<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
