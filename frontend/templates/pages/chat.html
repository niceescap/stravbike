{% extends "base.html" %}

{% block title %}Chat — Coach Strava{% endblock %}

{% block content %}
<div id="chat-container">
    <div id="chat-messages">
        <div class="chat-welcome">
            <h2>💬 Coach Strava</h2>
            <p>Discute avec ton coach IA. Il a accès à toutes tes activités, séances planifiées et compétitions.</p>
        </div>
    </div>
    <div id="chat-input-wrap">
        <textarea id="chat-input" placeholder="Pose ta question…" rows="1" onkeydown="Chat.onKeydown(event)"></textarea>
        <button id="chat-send" onclick="Chat.send()">Envoyer</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/chat.js"></script>
{% endblock %}
