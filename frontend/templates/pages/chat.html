{% extends "base.html" %}

{% block title %}Coach IA{% endblock %}

{% block content %}
<div class="chat-container">
    <div class="chat-header">
        <div class="chat-title">Coach IA</div>
        <div class="chat-status">
            <span class="status-dot"></span>
            <span class="status-text">Connecté</span>
        </div>
    </div>
    <div class="chat-messages" id="chat-messages">
        <div class="chat-welcome">
            <div class="welcome-icon">🚴</div>
            <h2>Coach Strava IA</h2>
            <p>Posez vos questions sur vos activités, votre entraînement, vos séances planifiées…</p>
            <div class="chat-suggestions">
                <button class="suggestion-chip" onclick="sendSuggestion('Quelle est ma charge d\'entraînement cette semaine ?')">📊 Charge d'entraînement</button>
                <button class="suggestion-chip" onclick="sendSuggestion('Analyse ma dernière activité')">🔍 Analyser ma dernière sortie</button>
                <button class="suggestion-chip" onclick="sendSuggestion('Quelles séances sont planifiées cette semaine ?')">📅 Séances planifiées</button>
            </div>
        </div>
    </div>
    <div class="chat-input-area">
        <div class="chat-input-wrap">
            <textarea id="chat-input" placeholder="Écrivez votre message…" rows="1"></textarea>
            <button class="btn-send" id="chat-send-btn" onclick="sendMessage()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                </svg>
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
    <script src="/static/js/chat.js"></script>
{% endblock %}
