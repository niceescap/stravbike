{% extends "base.html" %}

{% block title %}Activité — Coach Strava{% endblock %}

{% block head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% endblock %}

{% block content %}
<div class="detail-container" id="detail-container" data-activity-id="{{ activity_id }}">
    <div class="spinner"></div>
</div>

<!-- Modal graphique streams -->
<div id="chart-modal" class="chart-modal">
    <div class="chart-modal-content">
        <div class="chart-modal-header">
            <h2>📈 Courbes de séance</h2>
            <button class="chart-close" onclick="Charts.close()">✕</button>
        </div>
        <canvas id="chart-canvas"></canvas>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/charts.js"></script>
{% endblock %}
