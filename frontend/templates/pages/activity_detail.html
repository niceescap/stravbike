{% extends "base.html" %}

{% block title %}Activité — Coach Strava{% endblock %}

{% block head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% endblock %}

{% block content %}
<div class="detail-container" id="detail-container" data-activity-id="{{ activity_id }}">
    <div class="spinner"></div>
</div>

<!-- Modal graphique streams -->
<div id="chart-modal">
    <div id="chart-backdrop" onclick="Charts.close()"></div>
    <div id="chart-box">
        <div id="chart-box-header">
            <div id="chart-box-title">📈 Courbes de séance</div>
            <button id="chart-close" onclick="Charts.close()">✕</button>
        </div>
        <canvas id="chart-canvas"></canvas>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/charts.js"></script>
{% endblock %}
