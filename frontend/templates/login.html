<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Stravbike</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* ═══════════════════════════════════════════════════════════ */
        /* RESET & BASE                                                  */
        /* ═══════════════════════════════════════════════════════════ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f1115;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        /* ═══════════════════════════════════════════════════════════ */
        /* LOGIN CARD                                                    */
        /* ═══════════════════════════════════════════════════════════ */
        .login-card {
            background: #1a1d24;
            border: 1px solid #2a2d35;
            border-radius: 16px;
            padding: 40px 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        /* Logo */
        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-logo h1 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #FF6B35;
            letter-spacing: 1px;
        }
        .login-logo h1 span { color: #e0e0e0; }
        .login-logo p {
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }

        /* ═══════════════════════════════════════════════════════════ */
        /* FORM                                                          */
        /* ═══════════════════════════════════════════════════════════ */
        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #121418;
            border: 1px solid #2a2d35;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        .form-group input:focus {
            border-color: #FF6B35;
            box-shadow: 0 0 0 3px rgba(255,107,53,0.15);
        }
        .form-group input::placeholder { color: #555; }

        /* Submit button */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #FF6B35;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-family: inherit;
        }
        .btn-submit:hover { background: #e55a24; }
        .btn-submit:active { transform: scale(0.98); }

        /* Error banner */
        .error-banner {
            background: rgba(220,53,69,0.12);
            border: 1px solid rgba(220,53,69,0.3);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #f0a0a0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .error-banner::before { content: "⚠"; font-size: 16px; }

        /* Footer */
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #555;
        }
        .login-footer a { color: #FF6B35; text-decoration: none; }
        .login-footer a:hover { text-decoration: underline; }

        /* ═══════════════════════════════════════════════════════════ */
        /* RESPONSIVE                                                    */
        /* ═══════════════════════════════════════════════════════════ */
        @media (max-width: 480px) {
            .login-card { padding: 32px 24px; }
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-logo">
        <h1>STRAV<span>BIKE</span></h1>
        <p>Coach d'entraînement augmenté par IA</p>
    </div>

    {% if error %}
    <div class="error-banner">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
        <div class="form-group">
            <label for="email">Adresse email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="toi@exemple.com"
                required
                autofocus
                autocomplete="email"
            >
        </div>
        <button type="submit" class="btn-submit">Se connecter</button>
    </form>

    <div class="login-footer">
        <p>Accès réservé aux athlètes inscrits.</p>
        <p style="margin-top:4px">Pas encore de compte ? <a href="/auth/connect">Connecte ton Strava</a></p>
    </div>
</div>

</body>
</html>
